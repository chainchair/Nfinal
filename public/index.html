<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Nfinal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
</head>

<body style="background-image: url(background.png); 
    background-repeat: no-repeat; text-align: center;">
    <main>
        <h1>Calculadora de nota final</h1>
        <section class="container" style="background-color: #f9f9f9; padding-top: 1px;">
            
                <p style="padding: 0px 10px;">en esta web encontraras una herramienta completa que te permite saber toda 
                    la informacion sobre tu rendimiento academico con tus notas actuales.<br>
                    presiona los elementos en resumen para mas info </p>
                
            <section id="information" class="container" style="background-color: white; padding: 15px 30px;">  
                <p id="suma-porcentajes" style="display: block; justify-self: end; padding: 0px; margin: 0px;">acumulado: 0%</p>  
                        <div id="notas">
                            <template id="fila-template">
                                <div class="fila-nota">
                                    <div>
                                        <label class="input-group" type="text">Nota</label>
                                        <input type="text" class="input-nota" placeholder="3.2">
                                    </div>
                                    <div class="grupo-porcentaje">
                                        <div class="input-group">
                                            <label class="" type="text">Porcentaje</label>
                                            <input type="text" class="input-porcentaje" placeholder="25%">
                                        </div>
                                        <button type="button" class="btn-eliminar">eliminar</button>
                                    </div>
                                    
                                    
                                    
                                </div>
                            </template> 
                        </div>
                <div class="botones">
                <button id="btn-agregar" class="btn-agregar" type="button">Añadir nota</button>
                <button id="btn-calcular" class="btn-calcular" type="button">Calcular</button>
                </div>
            
            <section id="objetivo">
                <h2>Resumen</h2>
                <section id="resultados" class="contenedor_resultados">
                    <p class="resultado" id="necesaria"><img src="neutralface.svg" class="icon" alt="Neutral Face"><b>Necesaria:</b><b id="nota-minima-resultado"></b></p>
                    <p class="resultado" id="recomendada"><img src="happyface.svg" class="icon" alt="Happy Face"><b>Recomendada:</b><b id="nota-deseada-resultado"></b></p>
                    <p class="resultado" id="actual"><img src="current.svg" class="icon" alt="Current icon"><b>Actual:</b><b id="promedio-acumulado"></b></p>
                    <p class="resultado" id="minima"><img src="floor.svg" class="icon" alt="Floor icon"><b>Minima:</b><b id="nota-minima-posible"></b></p>
                </section>
            </section>
            </section>
        </section>
    </main>
    <script src="popup.js"></script>
    <script src="script.js"></script>

</body>
</html>
